services:
  db:
    image: postgres:18-alpine
    container_name: taskops-db
    environment:
      POSTGRES_DB: taskops
      POSTGRES_USER: taskops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definissez POSTGRES_PASSWORD dans .env}
    volumes:
      - donnees-postgres:/var/lib/postgresql   # ← changé : plus de "/data" à la fin
    networks:
      - taskops
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskops -d taskops"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    ports:
      - "5432:5432"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: taskops-api:${TAG:-local}
    container_name: taskops-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/taskops
      SPRING_DATASOURCE_USERNAME: taskops
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    networks:
      - taskops
    restart: unless-stopped

volumes:
  donnees-postgres:

networks:
  taskops:
    driver: bridge
